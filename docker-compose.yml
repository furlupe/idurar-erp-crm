include:
  - backend/docker-compose.yml
  - frontend/docker-compose.yml

services:
  db:
    image: mongo
    container_name: db
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    command: --port 27017

networks:
  internal:
    driver: bridge

volumes:
  mongodb_data:
