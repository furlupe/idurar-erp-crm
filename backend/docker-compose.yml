services:
  backend:
    image: crm-backend
    build:
      dockerfile: Dockerfile
    networks:
      - internal
    ports:
      - '8888:8888'
    expose:
      - '8888'
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE: 'mongodb://db:27017'
      PORT: 8888
      MAIL_FROM: ''
      SMTP_USER: ''
      SMTP_PASSWORD: ''
